<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content (Chrome/Edge Android 115+) hace que el
      teclado achique el layout viewport: los paneles fixed, como el drawer del
      carrito, se recalculan y el botón del pie no queda detrás del teclado.
      Lo ignoran los que no lo soportan; ahí responde useKeyboardAnchoring.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f6f2ea" />

    <title>Aurema — Tote bags 100% algodón y accesorios ecológicos</title>
    <meta
      name="description"
      content="Aurema. Tote bags 100% algodón y accesorios ecológicos con diseños para celebrar tu vida."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aurema — Diseños para celebrar tu vida" />
    <meta
      property="og:description"
      content="Tote bags 100% algodón y accesorios ecológicos con ilustraciones llenas de color."
    />
    <meta property="og:locale" content="es_AR" />

    <link rel="icon" href="/images/instagram/logo.jpg" type="image/jpeg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300..700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
