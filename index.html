<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content (Chrome/Edge Android 115+) hace que el
      teclado achique el layout viewport: los paneles fixed, como el drawer del
      carrito, se recalculan y el botón del pie no queda detrás del teclado.
      Lo ignoran los que no lo soportan; ahí responde useKeyboardAnchoring.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f6f2ea" />

    <title>Aurema | Tote bags ilustradas 100% algodón</title>
    <meta
      name="description"
      content="Descubrí las tote bags Aurema de algodón 100%, con ilustraciones llenas de color. Todos los diseños a $18.000. Pedí la tuya por WhatsApp."
    />
    <link rel="canonical" href="https://aurema.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aurema" />
    <meta property="og:url" content="https://aurema.vercel.app/" />
    <meta property="og:title" content="Aurema — Diseños para celebrar tu vida" />
    <meta
      property="og:description"
      content="Tote bags ilustradas 100% algodón a $18.000. Encontrá tu diseño favorito y consultá tu pedido por WhatsApp."
    />
    <meta
      property="og:image"
      content="https://aurema.vercel.app/images/instagram/modelo-1.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://aurema.vercel.app/images/instagram/modelo-1.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="518" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="Tote bag Aurema de algodón con diseño ilustrado de fases lunares"

    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"

    <link rel="icon" href="/images/instagram/logo.jpg" type="image/jpeg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
